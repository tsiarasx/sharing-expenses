name: Release & Versioning

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Get current version
        id: current_version
        run: |
          BACKEND_VERSION=$(node -e "console.log(require('./backend/package.json').version)")
          FRONTEND_VERSION=$(node -e "console.log(require('./frontend/package.json').version)")
          echo "backend_version=$BACKEND_VERSION" >> $GITHUB_OUTPUT
          echo "frontend_version=$FRONTEND_VERSION" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: new_version
        run: |
          CURRENT=${{ steps.current_version.outputs.backend_version }}
          BUMP=${{ github.event.inputs.version_bump || 'patch' }}

          # Parse current version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          PATCH=${PATCH%%-*}  # Remove prerelease

          case $BUMP in
            major)
              NEW_VERSION="$((MAJOR + 1)).0.0"
              ;;
            minor)
              NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
              ;;
            patch)
              NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
              ;;
          esac

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP" >> $GITHUB_OUTPUT

      - name: Update package versions
        env:
          NEW_VERSION: ${{ steps.new_version.outputs.new_version }}
        run: |
          npm version $NEW_VERSION --no-git-tag-version -w backend
          npm version $NEW_VERSION --no-git-tag-version -w frontend

      - name: Update CHANGELOG
        env:
          NEW_VERSION: ${{ steps.new_version.outputs.new_version }}
        run: |
          DATE=$(date '+%Y-%m-%d')
          TEMP=$(mktemp)
          echo "## [$NEW_VERSION] - $DATE" > $TEMP
          echo "" >> $TEMP
          echo "### Added" >> $TEMP
          echo "- " >> $TEMP
          echo "" >> $TEMP
          echo "### Changed" >> $TEMP
          echo "- " >> $TEMP
          echo "" >> $TEMP
          echo "### Fixed" >> $TEMP
          echo "- " >> $TEMP
          echo "" >> $TEMP
          cat CHANGELOG.md >> $TEMP
          mv $TEMP CHANGELOG.md

      - name: Create git tag
        env:
          NEW_VERSION: ${{ steps.new_version.outputs.new_version }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add backend/package.json frontend/package.json CHANGELOG.md
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]" || echo "Nothing to commit"
          git tag -a "v$NEW_VERSION" -m "Release version $NEW_VERSION" || true

      - name: Push changes
        run: |
          git push origin HEAD:main || true
          git push origin --tags || true

      - name: Create GitHub Release
        env:
          NEW_VERSION: ${{ steps.new_version.outputs.new_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$NEW_VERSION" \
            --title "Release v$NEW_VERSION" \
            --generate-notes || true

      - name: Log version update
        env:
          NEW_VERSION: ${{ steps.new_version.outputs.new_version }}
          BUMP_TYPE: ${{ steps.new_version.outputs.bump_type }}
        run: |
          echo "✓ Release created"
          echo "  Version: $NEW_VERSION"
          echo "  Bump type: $BUMP_TYPE"
          echo "  Date: $(date)"
